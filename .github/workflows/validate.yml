name: Validar POOQuest

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: public-ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias bloqueadas
        run: npm ci
      - name: Pruebas unitarias
        run: npm test
      - name: Build de Next.js
        run: npm run build
